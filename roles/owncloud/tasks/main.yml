- name: Become Block
  become: true
  block:
    - name: Create oCIS directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
        owner: 1000
        group: 1000
      loop:
        - "{{ config_dest }}/config"
        - "{{ config_dest }}/data"
        - "{{ config_dest }}/collabora"

    - name: Render oCIS app registry
      ansible.builtin.template:
        src: "app-registry.yaml.j2"
        dest: "{{ config_dest }}/config/app-registry.yaml"
        force: true
        mode: "0640"
        owner: 1000
        group: 1000

    - name: Render oCIS Content Security Policy
      ansible.builtin.template:
        src: "csp.yaml.j2"
        dest: "{{ config_dest }}/config/csp.yaml"
        force: true
        mode: "0640"
        owner: 1000
        group: 1000

    - name: Render oCIS Docker Compose
      ansible.builtin.template:
        src: "docker-compose.yml.j2"
        dest: "/home/{{ ansible_user }}/docker-compose.yml"
        force: true
        mode: "0664"
        owner: "{{ ansible_user }}"
        group: 994
